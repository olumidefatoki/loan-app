name: ci

on:
  push:
  pull_request:

defaults:
  run:
    working-directory: loan-backend-service

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: loan-backend-service/pom.xml

      - name: Unit and integration tests
        run: mvn -B verify -Pci

      - name: Package
        run: mvn -B -DskipTests package

  secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: loan-backend-service/.gitleaks.toml

  sast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: p/java p/owasp-top-ten loan-backend-service/.semgrep.yml

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: loan-backend-service/pom.xml

      - name: Require the NVD API key
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: test -n "$NVD_API_KEY"

      - name: OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: mvn -B -DskipTests -Pdependency-check verify

  sonar:
    if: ${{ vars.SONAR_HOST_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: loan-backend-service/pom.xml

      - name: SonarQube analysis
        working-directory: loan-backend-service
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        run: mvn -B -DskipTests sonar:sonar -Dsonar.projectKey=mfb-lending -Dsonar.qualitygate.wait=true

  image:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t loan-backend-service:${{ github.sha }} .

      - name: Scan the source tree
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: loan-backend-service
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Scan the image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: loan-backend-service:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
