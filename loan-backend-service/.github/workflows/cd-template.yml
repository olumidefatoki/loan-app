name: cd-template

on:
  workflow_dispatch:

jobs:
  publish-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Template only. Set push to true and add registry credentials before using this in a real environment.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: |
            loan-backend-service:${{ github.sha }}
            loan-backend-service:latest

      - name: Deployment hand-off
        run: |
          echo "Image built locally in the runner."
          echo "Replace this step with the environment deploy once a registry and target cluster are available."
          echo "Required runtime secrets: DB_URL, DB_USERNAME, DB_PASSWORD, REDIS_HOST, REDIS_PASSWORD, RABBITMQ_HOST, RABBITMQ_USERNAME, RABBITMQ_PASSWORD, OPS_USERNAME, OPS_PASSWORD."
          echo "Set SPRING_PROFILES_ACTIVE to development, staging, or production."
