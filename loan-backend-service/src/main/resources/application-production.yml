spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  security:
    ops-username: ${OPS_USERNAME}
    ops-password: ${OPS_PASSWORD}
    allowed-origins: "${APP_ALLOWED_ORIGINS:}"
  auth:
    jwt:
      hmac-secret: ${JWT_HMAC_SECRET}
    otp:
      pepper: ${OTP_PEPPER}
    encryption-key: ${APP_DATA_KEY}
    bootstrap:
      email: ${BOOTSTRAP_ADMIN_EMAIL:}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}
      phone-number: ${BOOTSTRAP_ADMIN_PHONE:}
      mfa-secret: ${BOOTSTRAP_ADMIN_MFA_SECRET:}
  customer:
    documents:
      directory: ${CUSTOMER_DOCUMENT_DIR}
