spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

app:
  security:
    ops-username: ${OPS_USERNAME:ops}
    ops-password: ${OPS_PASSWORD:}
    allowed-origins: "${APP_ALLOWED_ORIGINS:http://localhost:3000}"
  auth:
    jwt:
      hmac-secret: ${JWT_HMAC_SECRET:bG9jYWwtZGV2LWp3dC1obWFjLXNlY3JldC1rZXktMzJiIQ==}
    otp:
      pepper: ${OTP_PEPPER:local-dev-otp-pepper-value}
    encryption-key: ${APP_DATA_KEY:bG9jYWwtZGV2LWFlcy0yNTYtZGF0YS1rZXktMzJiISE=}
    bootstrap:
      email: ${BOOTSTRAP_ADMIN_EMAIL:admin@mfb.local}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:Str0ng-Passw0rd!}
      phone-number: ${BOOTSTRAP_ADMIN_PHONE:+2348000000001}
      full-name: ${BOOTSTRAP_ADMIN_NAME:Platform Administrator}
      mfa-secret: ${BOOTSTRAP_ADMIN_MFA_SECRET:JBSWY3DPEHPK3PXP}

logging:
  level:
    com.mfb.lending: DEBUG
