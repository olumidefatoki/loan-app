spring:
  application:
    name: loan-backend-service
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  datasource:
    hikari:
      pool-name: lending-pool
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 3000
      validation-timeout: 1000
      max-lifetime: 1800000
      data-source-properties:
        ApplicationName: ${spring.application.name}
  flyway:
    enabled: true
    locations: classpath:db/migration
    fail-on-missing-locations: true
    validate-on-migrate: true
    clean-disabled: true
  data:
    redis:
      timeout: 2s
      connect-timeout: 2s
      repositories:
        enabled: false
  rabbitmq:
    connection-timeout: 5s
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    whitelabel:
      enabled: false

springdoc:
  api-docs:
    enabled: false
    path: /v3/api-docs
  swagger-ui:
    enabled: false
    path: /swagger-ui.html

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      show-components: when-authorized
      roles: OPS
      group:
        liveness:
          include: livenessState
          show-details: never
        readiness:
          include: readinessState,db,redis,rabbit
          show-details: when-authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  info:
    env:
      enabled: false

info:
  application:
    name: MFB Digital Lending Platform
    description: Foundation services for digital lending

logging:
  level:
    root: INFO
    com.mfb.lending: INFO
    org.springframework.security: INFO

app:
  auth:
    jwt:
      issuer: mfb-lending
      audience: lending-api
      access-token-ttl: 15m
      refresh-token-ttl: 7d
      staff-refresh-token-ttl: 12h
      mfa-token-ttl: 5m
    password:
      staff-max-age: 90d
    lockout:
      max-failures: 5
      duration: 15m
    otp:
      ttl: 5m
      length: 6
      max-attempts: 5
      capture-enabled: false
    rate-limit:
      login-max-attempts: 10
      login-window: 15m
      register-max-attempts: 5
      register-window: 1h
  customer:
    documents:
      directory: ${CUSTOMER_DOCUMENT_DIR:${java.io.tmpdir}/mfb-customer-documents}
      max-bytes: 10485760
    kyc:
      provider: mock
  offer:
    expiry-days: 14
    fee-tax-rate: 0
    signature:
      mode: RECORDED_ACCEPTANCE
    documents:
      directory: ${OFFER_DOCUMENT_DIR:${java.io.tmpdir}/mfb-loan-agreements}
  core-banking:
    provider: ${CORE_BANKING_PROVIDER:mock}
    base-url: ${CORE_BANKING_BASE_URL:}
    authentication-method: ${CORE_BANKING_AUTH_METHOD:}
    client-id: ${CORE_BANKING_CLIENT_ID:}
    client-secret: ${CORE_BANKING_CLIENT_SECRET:}
    api-key: ${CORE_BANKING_API_KEY:}
    api-key-header: ${CORE_BANKING_API_KEY_HEADER:X-Api-Key}
    allow-insecure-tls: false
    request-timeout: ${CORE_BANKING_REQUEST_TIMEOUT:5s}
    connect-timeout: ${CORE_BANKING_CONNECT_TIMEOUT:2s}
    outbox-poll-ms: ${CORE_BANKING_OUTBOX_POLL_MS:15000}
    retry:
      max-attempts: ${CORE_BANKING_RETRY_MAX_ATTEMPTS:3}
      initial-backoff: ${CORE_BANKING_RETRY_INITIAL:200ms}
      max-backoff: ${CORE_BANKING_RETRY_MAX:2s}
      multiplier: ${CORE_BANKING_RETRY_MULTIPLIER:2}
    circuit-breaker:
      failure-threshold: ${CORE_BANKING_CIRCUIT_THRESHOLD:5}
      open-duration: ${CORE_BANKING_CIRCUIT_OPEN:30s}
    webhook:
      secret: ${CORE_BANKING_WEBHOOK_SECRET:}
      replay-window: ${CORE_BANKING_WEBHOOK_REPLAY_WINDOW:5m}
    paths: {}
