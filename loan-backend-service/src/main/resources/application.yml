spring:
  application:
    name: loan-backend-service
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  datasource:
    hikari:
      pool-name: lending-pool
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 3000
      validation-timeout: 1000
      max-lifetime: 1800000
      data-source-properties:
        ApplicationName: ${spring.application.name}
  flyway:
    enabled: true
    locations: classpath:db/migration
    fail-on-missing-locations: true
    validate-on-migrate: true
    clean-disabled: true
  data:
    redis:
      timeout: 2s
      connect-timeout: 2s
      repositories:
        enabled: false
  rabbitmq:
    connection-timeout: 5s
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    whitelabel:
      enabled: false

springdoc:
  api-docs:
    enabled: false
    path: /v3/api-docs
  swagger-ui:
    enabled: false
    path: /swagger-ui.html

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      show-components: when-authorized
      roles: OPS
      group:
        liveness:
          include: livenessState
          show-details: never
        readiness:
          include: readinessState,db,redis,rabbit
          show-details: when-authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  info:
    env:
      enabled: false

info:
  application:
    name: MFB Digital Lending Platform
    description: Foundation services for digital lending

logging:
  level:
    root: INFO
    com.mfb.lending: INFO
    org.springframework.security: INFO

app:
  auth:
    jwt:
      issuer: mfb-lending
      audience: lending-api
      access-token-ttl: 15m
      refresh-token-ttl: 7d
      staff-refresh-token-ttl: 12h
      mfa-token-ttl: 5m
    password:
      staff-max-age: 90d
    lockout:
      max-failures: 5
      duration: 15m
    otp:
      ttl: 5m
      length: 6
      max-attempts: 5
      capture-enabled: false
    rate-limit:
      login-max-attempts: 10
      login-window: 15m
      register-max-attempts: 5
      register-window: 1h
  customer:
    documents:
      directory: ${CUSTOMER_DOCUMENT_DIR:${java.io.tmpdir}/mfb-customer-documents}
      max-bytes: 10485760
    kyc:
      provider: mock
