spring:
  application:
    name: loan-backend-service
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  datasource:
    hikari:
      pool-name: lending-pool
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 3000
      validation-timeout: 1000
      max-lifetime: 1800000
      data-source-properties:
        ApplicationName: ${spring.application.name}
  flyway:
    enabled: true
    locations: classpath:db/migration
    fail-on-missing-locations: true
    validate-on-migrate: true
    clean-disabled: true
  data:
    redis:
      timeout: 2s
      connect-timeout: 2s
      repositories:
        enabled: false
  rabbitmq:
    connection-timeout: 5s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    whitelabel:
      enabled: false

springdoc:
  api-docs:
    enabled: false
    path: /v3/api-docs
  swagger-ui:
    enabled: false
    path: /swagger-ui.html

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      show-components: when-authorized
      roles: OPS
      group:
        liveness:
          include: livenessState
          show-details: never
        readiness:
          include: readinessState,db,redis,rabbit
          show-details: when-authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  info:
    env:
      enabled: false

info:
  application:
    name: MFB Digital Lending Platform
    description: Foundation services for digital lending

logging:
  level:
    root: INFO
    com.mfb.lending: INFO
    org.springframework.security: INFO
