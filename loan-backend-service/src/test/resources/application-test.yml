spring:
  main:
    banner-mode: off
  datasource:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

app:
  security:
    ops-username: ops
    ops-password: test-ops-password
    allowed-origins: []
  auth:
    jwt:
      hmac-secret: dGVzdC1zdWl0ZS1qd3QtaG1hYy1zZWNyZXQtMzJiISE=
    otp:
      pepper: test-suite-otp-pepper
      capture-enabled: true
    encryption-key: dGVzdC1zdWl0ZS1hZXMtMjU2LWRhdGEta2V5LTMyYiE=
    rate-limit:
      login-max-attempts: 10
      register-max-attempts: 100
    bootstrap:
      email: admin@mfb.test
      password: Str0ng-Passw0rd!
      phone-number: "+2348000000001"
      full-name: Platform Administrator
      mfa-secret: JBSWY3DPEHPK3PXP
  customer:
    documents:
      directory: ${java.io.tmpdir}/mfb-customer-it
      max-bytes: 2048
  offer:
    expiry-days: 14
    fee-tax-rate: 7.5
    signature:
      mode: RECORDED_ACCEPTANCE
    documents:
      directory: ${java.io.tmpdir}/mfb-loan-agreements-it
  core-banking:
    provider: mock
    webhook:
      secret: test-core-banking-webhook-secret
      replay-window: 5m
    retry:
      max-attempts: 2
      initial-backoff: 1ms
      max-backoff: 5ms
    circuit-breaker:
      failure-threshold: 3
      open-duration: 30s
    outbox-poll-ms: 600000

logging:
